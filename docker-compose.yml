services:
  db:
    image: postgres:15-alpine
    container_name: redware_db
    environment:
      POSTGRES_USER: redware
      POSTGRES_PASSWORD: redware
      POSTGRES_DB: redware
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U redware" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
